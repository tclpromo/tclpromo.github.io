<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TCL Promotion Repository</title>

  <link
    rel="icon"
    href="https://aws-obg-image-lb-2.tcl.com/content/dam/brandsite/it-resources/common/navigation/tcl-logo.svg"
    type="image/svg+xml"
  />

  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: #f7f8fa;
    }

    /*
      Keep the iframe exactly within the visible mobile viewport.
      Do not add extra height: the Apps Script app uses 100dvh/fixed modals
      internally, so an oversized iframe can push modal controls off-screen.
    */
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh; /* fallback */
      min-height: 0;
      overflow: hidden;
      background: #f7f8fa;
    }

    @supports (height: 100svh) {
      .iframe-container {
        height: 100svh;
      }
    }

    iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: #f7f8fa;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      color: #666;
      font-size: 1rem;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="iframe-container">
    <div class="loader" id="loader" role="status" aria-live="polite">
      Loading app...
    </div>

    <iframe
      src="https://script.google.com/macros/s/AKfycbwGmnawek-BBQyLP9jYQ9iQfbDWq0QI-feRq-pq-2bHk3XYxMwVDTbmfKZSkTWzVXtVjw/exec"
      title="TCL Promotion Repository"
      loading="eager"
      allowfullscreen
      onload="document.getElementById('loader').style.display='none';"
    ></iframe>
  </main>
</body>
</html>
